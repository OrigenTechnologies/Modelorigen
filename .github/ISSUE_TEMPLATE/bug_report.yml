
name: Bug Report
description: Report a problem or unexpected behavior in ModelOrigen
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve ModelOrigen.

        Please provide enough information for us to reproduce the issue.
        Do not include passwords, API keys, or other sensitive information.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which part of ModelOrigen has the problem?
      options:
        - Classical Machine Learning
        - Deep Learning
        - Data & AI Foundations
        - Dataset / Preprocessing
        - Model Evaluation
        - Learning Experience
        - User Interface
        - Mobile / Responsive Layout
        - Performance
        - Other
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Model or lesson
      description: For example SVM, Decision Tree, CNN, PCA, or Cross-Validation.
      placeholder: SVM
    validations:
      required: false

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Clearly describe the problem or unexpected behavior.
      placeholder: Describe what you observed.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Tell us exactly how to reproduce the issue.
      placeholder: |
        1. Open...
        2. Select...
        3. Change...
        4. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Chrome, Firefox, Safari, Edge
    validations:
      required: false

  - type: input
    id: device
    attributes:
      label: Device
      placeholder: Android phone, iPhone, Windows PC, Mac
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: Add screenshots, error messages, or other useful information.
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I checked that a similar issue has not already been reported.
          required: true
